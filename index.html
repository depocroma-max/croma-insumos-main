  const cab = rtEl('div', { className:'rt-ins-calc-cab rt-ins-propios-cab' });
  const tit = rtEl('div');
  tit.appendChild(rtEl('h3', { className:'rt-subtitulo', text:'Otros insumos' }));
  tit.appendChild(rtEl('p', { className:'rt-ins-sub', text:'Insumos que cargás vos a mano (cintas, rollos, cajas…). Indicá el stock y el punto de reposición: cuando el stock llega a ese número se marca para reponer y el bot también lo avisa.' }));
  cab.appendChild(tit);
  const btnAgregar = rtEl('button', { className:'btn btn-secondary', text:'+ Agregar insumo', attrs:{ type:'button' } });
  btnAgregar.addEventListener('click', () => rtInsumosAbrirPropio(null));
  cab.appendChild(btnAgregar);
  card.appendChild(cab);

  if (!propios.length) {
    card.appendChild(rtEl('p', { className:'rt-note rt-ins-nota', text:'Todavía no cargaste otros insumos. Con "Agregar insumo" podés sumar los que quieras controlar.' }));
    return card;
  }
  const clasesBadge = { reponer:'badge-danger', ok:'badge-success', sin_punto:'badge-neutral' };
  const textosEstado = { reponer:'Reponer', ok:'Stock suficiente', sin_punto:'Sin punto definido' };
  card.appendChild(rtTabla([
    'Insumo',
    { text:'Stock', className:'rt-ins-num' },
    { text:'Punto de reposición', className:'rt-ins-num rt-ins-sec' },
    { text:'Estado', className:'rt-ins-cob' },
    { text:'Pedido sugerido', className:'rt-ins-num rt-ins-sec' },
    { text:'Editar', className:'rt-ins-accion-texto' },
  ], propios, (p) => {
    const tr = rtEl('tr', { className: p.estado === 'reponer' ? 'rt-ins-urgente' : '' });
    tr.appendChild(rtEl('td', { text: p.nombre }));
    const tdStock = rtEl('td', { className:'rt-ins-num', text: nf.format(p.stock) });
    tdStock.appendChild(rtEl('span', { className:'rt-ins-unidad', text: p.unidad }));
    tr.appendChild(tdStock);
    tr.appendChild(rtEl('td', { className:'rt-ins-num rt-ins-sec', text: p.punto_reposicion !== null ? nf.format(p.punto_reposicion) : '—' }));
    const tdEstado = rtEl('td', { className:'rt-ins-cob' });
    tdEstado.appendChild(rtEl('span', { className:'badge ' + clasesBadge[p.estado], text: textosEstado[p.estado] }));
    tr.appendChild(tdEstado);
    let pedido = '—', titulo = '';
    if (p.estado === 'reponer') {
      if (p.pedido_sugerido !== null) pedido = nf.format(p.pedido_sugerido) + ' ' + p.unidad;
      else titulo = 'Falta definir la cantidad a pedir';
    }
    const tdPed = rtEl('td', { className:'rt-ins-num rt-ins-sec rt-ins-pedido', text: pedido });
    if (titulo) tdPed.title = titulo;
    tr.appendChild(tdPed);
    const tdAcc = rtEl('td', { className:'rt-ins-accion-texto' });
    const btn = rtEl('button', { className:'btn-sm rt-ins-btn-editar', text:'Editar', attrs:{ type:'button', 'aria-label':'Editar ' + p.nombre } });
    btn.addEventListener('click', () => rtInsumosAbrirPropio(p));
    tdAcc.appendChild(btn);
    tr.appendChild(tdAcc);
    return tr;
  }, { tableClassName:'rt-ins-tabla' }));
  return card;
}

// ── Vista ────────────────────────────────────────────────────────────────────
function rtInsumosTarjeta(iconName, tono, etiqueta, valor, detalle, lista) {
  const card = rtEl('div', { className:'card rt-ins-card' });
  const ic = rtEl('div', { className:'rt-kpi-icon rt-kpi-icon-' + tono + ' rt-ins-card-icon', attrs:{ 'aria-hidden':'true' } });
  ic.innerHTML = icon(iconName, ''); // icono estático del helper
  card.appendChild(ic);
  const cuerpo = rtEl('div');
  cuerpo.appendChild(rtEl('div', { className:'rt-ins-card-label', text: etiqueta }));
  cuerpo.appendChild(rtEl('div', { className:'rt-ins-card-valor', text: valor }));
  if (lista) {
    // Desglose visible: una línea por artículo con pedido > 0 (o el texto de "sin compra").
    const ul = rtEl('ul', { className:'rt-ins-desglose', attrs:{ 'aria-label':'Desglose del pedido sugerido' } });
    lista.forEach(t => ul.appendChild(rtEl('li', { text: t })));
    cuerpo.appendChild(ul);
  }
  cuerpo.appendChild(rtEl('div', { className:'rt-ins-card-detalle', text: detalle }));
  card.appendChild(cuerpo);
  return card;
}

function rtInsumosCampoParam(clave, etiqueta, ayuda, error) {
  const wrap = rtEl('div', { className:'rt-ins-param' });
  const id = 'rtInsP_' + clave;
  wrap.appendChild(rtEl('label', { className:'form-label', text: etiqueta, attrs:{ for: id } }));
  const input = rtEl('input', { className:'form-control' + (error ? ' rt-ins-invalido' : ''),
    attrs:{ id, type:'text', inputmode:'numeric', autocomplete:'off', 'aria-describedby': id + '_ayuda',
      'aria-invalid': error ? 'true' : 'false' } });
  input.value = RT_INSUMOS_PARAMS[clave];
  input.addEventListener('input', () => {
    const cursor = input.selectionStart;
    RT_INSUMOS_PARAMS[clave] = input.value;
    rtRenderVistaActual();
    const nuevo = document.getElementById(id);
    if (nuevo) { nuevo.focus(); try { nuevo.setSelectionRange(cursor, cursor); } catch (e) {} }
  });
  wrap.appendChild(input);
  wrap.appendChild(rtEl('div', { className: error ? 'form-error' : 'form-hint', text: error || ayuda, attrs:{ id: id + '_ayuda' } }));
  return wrap;
}

function renderRTInsumos(host) {
  const C = InsumosCalc;
  // Auto-carga diferida: rtCargarInsumos() vuelve a llamar rtRenderVistaActual() de forma
  // sincrónica, y hacerlo dentro de este render reentraba y dibujaba el encabezado dos veces.
  if (!RT_INSUMOS && !RT_INSUMOS_LOADING && !RT_INSUMOS_ERROR) queueMicrotask(() => rtCargarInsumos());

  // Encabezado: título + subtítulo, hora de actualización y botón propio.
  const cab = rtEl('div', { className:'rt-ins-cab' });
  const tit = rtEl('div');
  tit.appendChild(rtEl('h2', { className:'rt-ins-titulo', text:'Insumos de bolsas' }));
  tit.appendChild(rtEl('p', { className:'rt-ins-sub', text:'Control de stock y planificación de compras' }));
  cab.appendChild(tit);
  const der = rtEl('div', { className:'rt-ins-cab-der' });
  if (RT_INSUMOS) der.appendChild(rtEl('span', { className:'rt-ins-hora', text:'Actualizado ' + rtInsumosHora(RT_INSUMOS.generado_en) }));
  const btnAct = rtEl('button', { className:'btn btn-secondary', attrs:{ type:'button' } });
  btnAct.innerHTML = icon('refresh', '') + ' '; // icono estático del helper
  btnAct.appendChild(document.createTextNode(RT_INSUMOS_LOADING ? 'Actualizando…' : 'Actualizar insumos'));
  btnAct.disabled = RT_INSUMOS_LOADING;
  btnAct.addEventListener('click', () => rtCargarInsumos(true));
  der.appendChild(btnAct);
  cab.appendChild(der);
  host.appendChild(cab);

  const nota = rtEl('p', { className:'rt-ins-periodo' });
  nota.textContent = 'El consumo se estima con los últimos ' + (RT_INSUMOS ? RT_INSUMOS.ventana_consumo_dias : 90) + ' días. El período global de arriba no modifica este cálculo.';
  host.appendChild(nota);

  const zona = rtEl('div');
  host.appendChild(zona);

  if (!RT_INSUMOS) {
    if (RT_INSUMOS_LOADING) return rtEstado(zona, 'loading', 'Calculando cobertura de insumos...');
    if (RT_INSUMOS_ERROR) return rtEstado(zona, 'error', 'No se pudo calcular. ' + RT_INSUMOS_ERROR, () => rtCargarInsumos(true));
    return rtEstado(zona, 'loading', 'Calculando cobertura de insumos...');
  }

  // Datos anteriores tras una actualización fallida: se identifican con su fecha.
  if (RT_INSUMOS_ERROR) {
    const al = rtEl('div', { className:'alert alert-warning rt-ins-bloque', attrs:{ role:'alert' } });
    al.appendChild(rtEl('div', { text:'Datos anteriores del ' + rtInsumosFechaHora(RT_INSUMOS.generado_en) + ': no se pudieron actualizar los insumos (' + RT_INSUMOS_ERROR + ').' }));
    const reint = rtEl('button', { className:'btn-sm', text:'Reintentar', attrs:{ type:'button' } });
    reint.addEventListener('click', () => rtCargarInsumos(true));
    al.appendChild(reint);
    zona.appendChild(al);
  }

  const datos = RT_INSUMOS.data;
  if (!datos.length) return rtEstado(zona, 'vacio', 'Sin bolsas con actividad para mostrar.');

  const umbral = RT_INSUMOS.umbral_cobertura_dias;
  const val = C.validarParametros(RT_INSUMOS_PARAMS);
  const params = val.ok ? val.valores : null;
  const res = C.resumen(datos, params, umbral);
  const propios = RT_INSUMOS.propios || [];
  const propiosRep = C.propiosAReponer(propios);

  // ── Tarjetas de resumen ──
  const cards = rtEl('div', { className:'rt-ins-cards' });
  const totalReponer = res.paraReponer + propiosRep.length;
  cards.appendChild(rtInsumosTarjeta('alertTriangle', 'danger', 'Para reponer',
    nf.format(totalReponer) + (totalReponer === 1 ? ' artículo' : ' artículos'),
    nf.format(res.paraReponer) + (res.paraReponer === 1 ? ' bolsa' : ' bolsas') + ' con ' + umbral + ' días de cobertura o menos'
      + (propiosRep.length ? ' · ' + nf.format(propiosRep.length) + (propiosRep.length === 1 ? ' insumo propio' : ' insumos propios') + ' en su punto de reposición' : '')
      + (res.conDatosARevisar ? ' · ' + res.conDatosARevisar + ' con datos a revisar' : '')));
  cards.appendChild(rtInsumosTarjeta('warehouse', 'info', 'Stock en depósito',
    nf.format(res.stockDeposito), 'Unidades disponibles en depósito 90 (sin fallados)'));
  const lineasPropios = propiosRep.map(p => p.nombre + ' — ' + (p.pedido_sugerido !== null ? nf.format(p.pedido_sugerido) + ' ' + p.unidad : 'definir cantidad'));
  const lineasBolsas = params ? res.desglose.map(it => it.codigo + ' · ' + it.nombre + ' — ' + nf.format(it.cantidad) + ' unidades') : null;
  const lineasPedido = params
    ? ((lineasBolsas.length || lineasPropios.length)
        ? lineasBolsas.concat(lineasPropios)
        : ['No se requiere compra con estos parámetros'])
    : null;
  cards.appendChild(rtInsumosTarjeta('shoppingCart', 'violet', 'Pedido sugerido',
    params ? nf.format(res.pedidoTotal) + ' unidades' + (propiosRep.length ? ' de bolsas' : '') : '—',
    params ? 'Para cubrir ' + params.dias + (params.dias === 1 ? ' día' : ' días') + ' · plazo del proveedor ' + params.plazo + ' d · margen de seguridad ' + params.margen + ' d' : 'Corregí los parámetros para calcular',
    lineasPedido));
  zona.appendChild(cards);

  // ── Calculadora ──
  const calc = rtEl('div', { className:'card rt-ins-bloque' });
  const calcCab = rtEl('div', { className:'rt-ins-calc-cab' });
  const calcTit = rtEl('div');
  calcTit.appendChild(rtEl('h3', { className:'rt-subtitulo', text:'Planificar reposición' }));
  calcTit.appendChild(rtEl('p', { className:'rt-ins-sub', text:'Simulá escenarios de compra. Días calendario; no modifica stock ni genera compras.' }));
  calcCab.appendChild(calcTit);
  const params3 = rtEl('div', { className:'rt-ins-params' });
  params3.appendChild(rtInsumosCampoParam('dias', 'Días a cubrir', 'Cobertura objetivo después del plazo de entrega', val.errores.dias));
  params3.appendChild(rtInsumosCampoParam('plazo', 'Plazo del proveedor', 'Días hasta que llega el pedido', val.errores.plazo));
  params3.appendChild(rtInsumosCampoParam('margen', 'Margen de seguridad', 'Días extra de resguardo', val.errores.margen));
  calcCab.appendChild(params3);
  calc.appendChild(calcCab);
  calc.appendChild(rtEl('p', { className:'rt-note rt-ins-nota', text:'Pedido = consumo diario × (días a cubrir + plazo + margen) − stock utilizable. El plazo y el margen se suman al horizonte del cálculo.' }));
  zona.appendChild(calc);

  // ── Tabla principal ──
  const tabla = rtEl('div', { className:'card rt-ins-bloque' });
  const tCab = rtEl('div', { className:'rt-ins-calc-cab' });
  const tTit = rtEl('div');
  tTit.appendChild(rtEl('h3', { className:'rt-subtitulo', text:'Stock y reposición' }));
  tTit.appendChild(rtEl('p', { className:'rt-ins-sub', text:'Estado actual de stock, cobertura y sugerencia de pedido por tipo de bolsa.' }));
  tCab.appendChild(tTit);

  const fecha = new Date();
  const texto = params ? C.textoPedido(datos, params, fecha, propios) : null;
  const acc = rtEl('div', { className:'rt-ins-acciones' });
  const btnCopiar = rtEl('button', { className:'btn btn-outline', attrs:{ type:'button' } });
  btnCopiar.innerHTML = icon('fileText', '') + ' '; // icono estático del helper
  btnCopiar.appendChild(document.createTextNode('Copiar pedido'));
  const btnCorreo = rtEl('button', { className:'btn btn-secondary', attrs:{ type:'button' } });
  btnCorreo.innerHTML = icon('mail', '') + ' '; // icono estático del helper
  btnCorreo.appendChild(document.createTextNode('Preparar correo'));
  btnCopiar.disabled = btnCorreo.disabled = !texto;
  btnCopiar.addEventListener('click', async () => {
    const ok = await rtInsumosCopiarTexto(texto);
    rtInsumosAvisar(ok ? 'Pedido copiado al portapapeles.' : 'No se pudo copiar automáticamente. Usá "Preparar correo" y copiá el texto.');
  });
  btnCorreo.addEventListener('click', () => rtInsumosAbrirCorreo(texto, new Date(), propiosRep.length > 0));
  acc.appendChild(btnCopiar); acc.appendChild(btnCorreo);
  tCab.appendChild(acc);
  tabla.appendChild(tCab);

  // Explicación breve cuando las acciones están deshabilitadas + confirmación (aria-live).
  let porQue = '';
  if (!params) porQue = 'Corregí los parámetros de la calculadora para generar el pedido.';
  else if (!texto) {
    const hayRevisar = datos.some(f => f.cobertura_estado === 'datos_a_revisar');
    porQue = hayRevisar
      ? 'No hay pedido sugerido: hay artículos con datos a revisar y el resto tiene stock suficiente para los días indicados.'
      : 'No hay pedido sugerido: el stock utilizable alcanza para los días indicados (o no hay consumo reciente).';
  }
  const aviso = rtEl('p', { className:'rt-ins-aviso', attrs:{ id:'rtInsAviso', role:'status', 'aria-live':'polite' } });
  aviso.textContent = RT_INSUMOS_AVISO || porQue;
  tabla.appendChild(aviso);

  const headers = [
    'COD', { text:'Bolsa', className:'rt-ins-bolsa' },
    { text:'Stock locales', className:'rt-ins-num rt-ins-sec' },
    { text:'Depósito 90', className:'rt-ins-num rt-ins-sec' },
    { text:'Consumo / día', className:'rt-ins-num rt-ins-sec' },
    { text:'Cobertura total', className:'rt-ins-cob' },
    { text:'Pedido sugerido', className:'rt-ins-num' },
    { text:'Detalle', className:'rt-ins-accion' },
  ];
  tabla.appendChild(rtTabla(headers, datos, (f) => {
    const est = C.estadoCobertura(f, umbral);
    const ped = params ? C.pedidoSugerido(f, params) : { estado:'invalido', cantidad:null };
    const tr = rtEl('tr', { className: est.color === 'rojo' ? 'rt-ins-urgente' : '' });
    // En móvil la columna "Bolsa" se oculta y el nombre baja debajo del código.
    const tdCod = rtEl('td', { text: f.codigo });
    tdCod.appendChild(rtEl('span', { className:'rt-ins-cod-nombre', text: C.nombreCorto(f) }));
    tr.appendChild(tdCod);
    tr.appendChild(rtEl('td', { className:'rt-ins-bolsa', text: C.nombreCorto(f) }));
    // Valores crudos: un stock negativo se ve (y se marca), nunca se convierte en 0 en silencio.
    const locCrudo = f.stock_locales_crudo !== undefined ? f.stock_locales_crudo : f.stock_locales;
    const depCrudo = f.stock_deposito_90_crudo !== undefined ? f.stock_deposito_90_crudo : f.stock_deposito_90;
    tr.appendChild(rtEl('td', { className:'rt-ins-num rt-ins-sec' + (locCrudo < 0 ? ' rt-ins-neg' : ''), text: nf.format(locCrudo), attrs: locCrudo < 0 ? { title:'Stock negativo: revisar en Sysneo' } : {} }));
    tr.appendChild(rtEl('td', { className:'rt-ins-num rt-ins-sec' + (depCrudo < 0 ? ' rt-ins-neg' : ''), text: nf.format(depCrudo), attrs: depCrudo < 0 ? { title:'Stock negativo: revisar en Sysneo' } : {} }));
    tr.appendChild(rtEl('td', { className:'rt-ins-num rt-ins-sec', text: f.consumo_diario_estimado !== null ? nf1.format(f.consumo_diario_estimado) : '—' }));

    const tdCob = rtEl('td', { className:'rt-ins-cob' });
    const clasesBadge = { rojo:'badge-danger', ambar:'badge-warning', verde:'badge-success', gris:'badge-neutral' };
    const esGris = est.color === 'gris';
    // Gris: el badge lleva el texto del estado (sin consumo / datos a revisar); el
    // resto muestra los días y el texto del estado debajo -- nunca solo color.
    tdCob.appendChild(rtEl('span', { className:'badge ' + clasesBadge[est.color], text: esGris ? est.texto : rtInsumosTextoCobertura(f) }));
    if (!esGris) tdCob.appendChild(rtEl('span', { className:'rt-ins-estado', text: est.texto }));
    tr.appendChild(tdCob);

    let textoPedido = '—', titulo = '';
    if (ped.estado === 'ok') textoPedido = nf.format(ped.cantidad);
    else if (ped.estado === 'sin_consumo') titulo = 'Sin consumo reciente: no se genera compra automática';
    else if (ped.estado === 'datos_a_revisar') titulo = 'Datos a revisar: no se recomienda un pedido';
    const tdPed = rtEl('td', { className:'rt-ins-num rt-ins-pedido', text: textoPedido });
    if (titulo) tdPed.title = titulo;
    tr.appendChild(tdPed);

    const tdAcc = rtEl('td', { className:'rt-ins-accion' });
    const btn = rtEl('button', { className:'btn-sm rt-ins-btn-detalle', attrs:{ type:'button', 'aria-label':'Ver detalle de ' + f.codigo + ' ' + C.nombreCorto(f) } });
    btn.innerHTML = icon('chevronRight', ''); // icono estático del helper
    btn.addEventListener('click', () => rtInsumosAbrirDetalle(f.codigo));
    tdAcc.appendChild(btn);
    tr.appendChild(tdAcc);
    return tr;
  }, { tableClassName:'rt-ins-tabla' }));
  zona.appendChild(tabla);

  zona.appendChild(rtInsumosSeccionPropios(propios));

  // ── Alerta prioritaria ──
  const prio = C.prioritario(datos);
  const hayRevisar = datos.some(f => f.cobertura_estado === 'datos_a_revisar');
  const hayDetalle = (f) => f && f.sucursales && f.sucursales.length;
  let alerta;
  if (prio && prio.cobertura_dias <= umbral) {
    alerta = rtEl('div', { className:'alert alert-danger rt-ins-bloque', attrs:{ role:'status' } });
    const t = rtEl('div', { className:'rt-ins-alerta-texto' });
    t.appendChild(rtEl('strong', { text:'Prioridad: ' + prio.codigo + ' · ' + (prio.producto || '') }));
    const dias = prio.cobertura_dias < 1 ? 'menos de 1 día' : 'aproximadamente ' + nf.format(Math.round(prio.cobertura_dias)) + (Math.round(prio.cobertura_dias) === 1 ? ' día' : ' días');
    t.appendChild(rtEl('div', { text:'Quedan ' + dias + ' de cobertura.' }));
    alerta.appendChild(t);
    if (hayDetalle(prio)) {
      const b = rtEl('button', { className:'btn btn-outline', text:'Ver sucursales', attrs:{ type:'button' } });
      b.addEventListener('click', () => rtInsumosAbrirDetalle(prio.codigo));
      alerta.appendChild(b);
    }
  } else if (prio) {
    alerta = rtEl('div', { className:'alert alert-success rt-ins-bloque', attrs:{ role:'status' } });
    alerta.appendChild(rtEl('div', { text:'Los artículos con consumo reciente tienen cobertura suficiente (más de ' + umbral + ' días).' + (hayRevisar ? ' Hay artículos con datos a revisar: no están incluidos en esta conclusión.' : '') }));
  } else {
    alerta = rtEl('div', { className:'alert alert-warning rt-ins-bloque', attrs:{ role:'status' } });
    alerta.appendChild(rtEl('div', { text: hayRevisar
      ? 'No se puede estimar la cobertura: hay artículos con datos a revisar y el resto no tiene consumo reciente.'
      : 'No hay consumo reciente medible: no se puede estimar la cobertura de ningún artículo.' }));
  }
  zona.appendChild(alerta);

  // ── Cómo se calcula (desplegable) ──
  const det = rtEl('details', { className:'card rt-ins-bloque rt-ins-como' });
  det.appendChild(rtEl('summary', { text:'Cómo se calcula' }));
  const lista = rtEl('ul', { className:'rt-note' });
  const excl = RT_INSUMOS.centros_excluidos ? Object.keys(RT_INSUMOS.centros_excluidos).map(c => RT_INSUMOS.centros_excluidos[c]).join(', ') : '';
  [
    'Universo: rubros INSUMOS / ART REGALOS Y PROMOS, solo productos con "BOLSA" en el nombre.',
    'Consumo: salidas reales de los últimos ' + RT_INSUMOS.ventana_consumo_dias + ' días (ventas y salidas de sucursal). No cuenta transferencias internas entre depósito y sucursal, ni ajustes de inventario.',
    'Consumo diario estimado = salidas válidas ÷ ' + RT_INSUMOS.ventana_consumo_dias + '.',
    'Stock utilizable = depósito 90 + locales activos. Depósito 90 = depósito central menos fallados 93 (los fallados no cuentan como disponibilidad). Excluye sucursales cerradas o inactivas' + (excl ? ' (' + excl + ')' : '') + ', tanto del stock como del consumo.',
    'Cobertura total = stock utilizable ÷ consumo diario estimado.',
    'Pedido sugerido = máximo entre 0 y redondeo hacia arriba de [consumo diario × (días a cubrir + plazo + margen) − stock utilizable]. Se calcula con precisión completa y se redondea solo al final.',
    'Umbral de aviso: ' + umbral + ' días de cobertura o menos → "Para reponer". Estados por color con su texto: urgente (15 días o menos), reponer pronto (hasta ' + umbral + '), cobertura suficiente (más de ' + umbral + ').',
    'Sin consumo reciente: no hubo salidas válidas en la ventana; no se calcula cobertura ni se genera compra automática. Datos a revisar: stock negativo o inconsistente; tampoco se recomienda un pedido.',
    'Otros insumos: los carga el equipo a mano (stock actual y punto de reposición, no vienen de Sysneo). Se marcan "Reponer" cuando el stock es igual o menor al punto de reposición; no se estima consumo ni cobertura. El bot de WhatsApp los avisa igual que a las bolsas.',
    'Último ingreso y cantidad recibida son solo informativos (última compra registrada al proveedor): no se usan para calcular.',
  ].forEach(t => lista.appendChild(rtEl('li', { text: t })));
  det.appendChild(lista);
  zona.appendChild(det);
}
</script>
<script>
  window.addEventListener('load', function() {
    var splash = document.getElementById('splashScreen');
    if (!splash) return;
    setTimeout(function() {
      splash.classList.add('splash-hide');
      setTimeout(function() { splash.remove(); }, 600);
    }, 1200);
  });
</script>
